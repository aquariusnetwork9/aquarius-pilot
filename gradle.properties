plugin_version=0.1.0
plugin_name=AquariusPilot
plugin_id=aquarius-pilot
# MC version of ZenithProxy this plugin is compiled for.
mc=1.21.4
maven_group=com.aquariuspilot

# Path to the ZenithProxy "fat" jar to compile against (the same jar the launcher runs).
# Leave unset to use ./libs/ZenithProxy.jar. You may also override per-invocation:
#   ./gradlew build -Pzenith_jar=/path/to/ZenithProxy.jar
#
# IMPORTANT (temporary): this plugin depends on com.zenith.event.client.BotPrePhysicsTick and
# Bot#setFallFlying(boolean), which are only available on the aquariusnetwork9/ZenithProxy fork's
# feature/pre-physics-tick-hook branch (upstream PR rfresh2/ZenithProxy#313, not yet merged). See
# .github/workflows/build.yml for how CI builds that branch to compile against. Once #313 merges,
# switch back to downloading an official +java.1.21.4 release (see the TODO in that workflow).
#zenith_jar=

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
